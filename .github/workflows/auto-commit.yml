name: Auto Commit

on:
  schedule:
    - cron: "0 0 * * *"      # runs once each day at 00:00 UTC
  workflow_dispatch:          # lets you trigger manually

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Choose today's activity level
        id: activity
        run: echo "count=$((RANDOM % 9 + 2))" >> "$GITHUB_OUTPUT"

      - name: Make randomized daily commits
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "181772467+ahmadzan01@users.noreply.github.com"
          for i in $(seq 1 "${{ steps.activity.outputs.count }}"); do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') commit ${i}/${{ steps.activity.outputs.count }}" >> log.txt
            git add log.txt
            git commit -m "chore: auto tick ${i}/${{ steps.activity.outputs.count }}"
          done
          git push
